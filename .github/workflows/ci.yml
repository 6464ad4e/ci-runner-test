name: CI

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run build
        continue-on-error: true
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Test
        run: npm test
