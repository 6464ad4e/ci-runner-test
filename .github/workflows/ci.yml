name: CI

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ CI failed on PR #${{ github.event.pull_request.number }} in ${{ github.repository }}
          Branch: ${{ github.head_ref }}
          Commit: ${{ github.sha }}
          Link: ${{ github.event.pull_request.html_url }}"

      - name: Notify Telegram on success
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="✅ CI passed on PR #${{ github.event.pull_request.number }} in ${{ github.repository }}"
